<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Imagens Responsivas</title>
    <meta name="author" content="Jackson Raupp" />
    <meta
      name="description"
      content="S03 – Atividade de Aprendizagem: Imagens Responsivas"
    />

    <link rel="stylesheet" href="estilos/imagens-responsivas.css" />
  </head>

  <body>
    <header>
      <h1>Imagens Responsivas</h1>
    </header>

    <main>
      <div class="principal">
        <picture>
          <source
            srcset="imagens/principal-grande.webp"
            media="(min-width: 1000px)"
          />
          <source
            srcset="imagens/principal-media.webp"
            media="(min-width: 550px)"
          />
          <img
            src="imagens/principal-pequena.webp"
            alt="Templo de Salt Lake"
            width="500"
            height="250"
          />
        </picture>
      </div>
    </main>

    <footer>
      <br />
      <hr />

    </footer>
  </body>
</html>
