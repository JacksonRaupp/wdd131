<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Avaliação de Produto</title>
    <meta name="author" content="Jackson Raupp" />
    <meta
      name="description"
      content="BYU - S05 — Tarefa: Formulário de Avaliação de Produto"
    />

    <link rel="stylesheet" href="estilos/formulario.css" />

    <script src="scripts/formulario.js" defer></script>
  </head>

  <body>
    <header>
      <br />

      <h1>Avaliação de Produto</h1>

      <br />
      <hr />
      <br />
    </header>

    <main>
      <form method="get" action="avaliacao.html" id="form-avaliacao">
        <fieldset>
          <br />

          <div id="seletor-produtos">
            <label for="produto">
              <span class="rotulo">
                Nome do Produto<span class="obrigatorio">*</span>
              </span>

              <select name="produto" id="produto" required>
                <option value="" disabled selected>
                  <p>Selecione um produto...</p>
                </option>
              </select>
            </label>
          </div>

          <br /><br />

          <div id="classificacao">
            <span class="rotulo">
              Classificação Geral<span class="obrigatorio">*</span>
            </span>

            <div id="estrelas">
              <label for="estrela-a"></label>
              <input
                type="radio"
                name="estrelas"
                id="estrela-a"
                value="5"
                aria-label="5 estrelas"
                required
              />

              <label for="estrela-b"></label>
              <input
                type="radio"
                name="estrelas"
                id="estrela-b"
                value="4"
                aria-label="4 estrelas"
                required
              />

              <label for="estrela-c"></label>
              <input
                type="radio"
                name="estrelas"
                id="estrela-c"
                value="3"
                aria-label="3 estrelas"
                required
              />

              <label for="estrela-d"></label>
              <input
                type="radio"
                name="estrelas"
                id="estrela-d"
                value="2"
                aria-label="2 estrelas"
                required
              />

              <label for="estrela-e"></label>
              <input
                type="radio"
                name="estrelas"
                id="estrela-e"
                value="1"
                aria-label="1 estrela"
                required
              />
            </div>
          </div>

          <br />

          <div id="entrada-data">
            <label for="data">
              <span class="rotulo">
                Data de Instalação<span class="obrigatorio">*</span>
              </span>

              <input type="date" name="data" id="data" required />
            </label>
          </div>

          <br /><br />

          <div id="recursos">
            <p>Quais recursos você achou úteis no produto?</p>
            <span class="sugestao">(Marque todos que se aplicam)</span>

            <div>
              <label for="desempenho">
                <input
                  type="checkbox"
                  name="desempenho"
                  id="desempenho"
                  value="desempenho"
                />
                Desempenho
              </label>

              <label for="design">
                <input
                  type="checkbox"
                  name="design"
                  id="design"
                  value="design"
                />
                Design
              </label>

              <label for="durabilidade">
                <input
                  type="checkbox"
                  name="durabilidade"
                  id="durabilidade"
                  value="durabilidade"
                />
                Durabilidade
              </label>

              <label for="facilidade">
                <input
                  type="checkbox"
                  name="facilidade"
                  id="facilidade"
                  value="facilidade"
                />
                Facilidade de Uso
              </label>
            </div>
          </div>

          <br /><br />

          <div id="entrada-avaliacao">
            <label for="avaliacao">
              <span class="rotulo">
                Avaliação Escrita <span class="sugestao">(Opcional)</span>
              </span>

              <textarea
                name="avaliacao"
                id="avaliacao"
                placeholder="Ex.: O melhor que está tendo..."
              ></textarea>
            </label>
          </div>

          <br /><br />

          <div id="entrada-nome">
            <label for="nome">
              <span class="rotulo">
                Seu Nome <span class="sugestao">(Opcional)</span>
              </span>

              <input
                type="text"
                name="nome"
                id="nome"
                placeholder="Ex.: John Doe"
              />
            </label>
          </div>

          <br />
        </fieldset>

        <br />

        <button type="submit">Submeter Avaliação</button>
      </form>
    </main>

    <footer>
      <br />
      <hr />
      <br />

      <p>&COPY;<span id="anoAtual"></span> · Jackson Raupp</p>

      <p>Última modificação: <span id="ultimaModificacao"></span></p>

      <br />
    </footer>
  </body>
</html>
